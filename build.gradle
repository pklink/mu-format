plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'com.diffplug.spotless' version '8.9.0'
    id 'net.ltgt.errorprone' version '5.1.0'
}

group = 'net.einself'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'net.einself.mu.cli.Main'
}

shadowJar {
    // produces mu-format-1.0-SNAPSHOT-all.jar — separate from the thin jar
}

tasks.named('shadowDistTar') { enabled = false }
tasks.named('shadowDistZip') { enabled = false }

dependencies {
    // Core dependencies
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'io.github.wasabithumb:jtoml:1.5.2'
    implementation 'info.picocli:picocli:4.7.7'
    implementation 'com.google.code.gson:gson:2.14.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.18'
    implementation 'ch.qos.logback:logback-classic:1.6.2'

    // Architecture support
    implementation 'org.jmolecules:jmolecules-ddd:2.0.1'

    // Null safety
    implementation 'org.jspecify:jspecify:1.0.0'
    errorprone 'com.uber.nullaway:nullaway:0.12.7'
    errorprone 'com.google.errorprone:error_prone_core:2.38.0'

    // Testing
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    
    // Architecture testing
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testImplementation 'org.jmolecules.integrations:jmolecules-archunit:0.33.0'
}

test {
    useJUnitPlatform()
}

tasks.named('compileJava', JavaCompile) {
    options.errorprone {
        option('NullAway:OnlyNullMarked', 'true')
        error('NullAway')
    }
}

tasks.named('compileTestJava', JavaCompile) {
    options.errorprone.enabled = false
}

spotless {
    java {
        eclipse('4.34').configFile('config/eclipse-jdt-formatter.xml')
        target 'src/**/*.java'
    }
}

tasks.named('build') {
    dependsOn('spotlessCheck')
}

tasks.register('installGitHook') {
    doLast {
        def hookFile = file("${rootDir}/scripts/pre-commit")
        def linkFile = file("${rootDir}/.git/hooks/pre-commit")
        linkFile.delete()
        java.nio.file.Files.createSymbolicLink(linkFile.toPath(), hookFile.toPath())
    }
}
